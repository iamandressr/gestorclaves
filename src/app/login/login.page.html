<ion-content>
  <div class="container">
    <div class="card">
      <a class="login">Login</a>

      <div class="inputBox">
        <input type="text" [(ngModel)]="username" required />
        <span>Usuario</span>
      </div>

      <div class="inputBox">
        <input type="password" [(ngModel)]="password" required />
        <span>Contraseña</span>
      </div>

      <button class="enter" (click)="login()">Ingresar</button>
    </div>
  </div>
</ion-content>
